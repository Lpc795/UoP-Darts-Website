<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

</head>
<body>

<div id="logo">
    <img src="/assets/logo.png" alt="Logo">
    <h1>Tournaments</h1>
</div>

<div class="topnav">
    <a href="/admin/admin.html">Dashboard</a>
    <a href="/admin/tournaments.html" class="active">Tournaments</a>

<section id="tournament-setup" style="text-align:center; margin-top:40px;">
    <h2>Create a Knockout Tournament</h2>

    <div class="setup-row" style="justify-content:center;">
        <label for="player-count" style="width:180px; text-align:right; padding-right:10px;">
            Number of players:
        </label>
        <input type="number" id="player-count" min="2" max="128"
               style="padding:8px 12px; font-size:16px; border-radius:6px; border:1px solid #444; background:#1c1c1c; color:white;">
    </div>

    <div class="join-now">
        <a class="join-btn" href="#" onclick="goToKnockouts()">Knockouts</a>
    </div>
</section>
