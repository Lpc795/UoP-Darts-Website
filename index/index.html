<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uop Darts</title>
  <link rel="icon" type="image/x-icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/index/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="/index/league-script.js"></script>
</head>

<body>
  <header id="container">
    <a href="index.html" id="logo">
      <img src="/assets/logo.png" alt="logo png">
      <h1>UOP DARTS</h1>
    </a>
  </header>

  <nav class="topnav">
    <a class="active" href="/index/index.html">Home</a>
    <a href="/index/news.html">News</a>
    <a href="/index/contact.html">Contact</a>
    <a href="/index/about.html">About</a>

  <main>

      <img src="/assets/team-photo.jpg" alt="team-photo">
    </section>

    <section class="table-wrapper">
      <h2>UDUK South</h2>

      <div class="scroll-container">
        <table class="league-table">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Team</th>
              <th>P</th>
              <th>W</th>
              <th>L</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
            </tr>
          </thead>
          <tbody id="league-body"></tbody>
        </table>
      </div>
    </section>

  <footer id="icons">
    <a href="https://www.instagram.com/uopdarts/" target="_blank">
      <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="https://www.uduk.co.uk/" target="_blank">
      <img src="/assets/uduk.png" alt="UDUK" class="icon">
    </a>

      <img src="/assets/upsu.png" alt="UPSU" class="icon">
    </a>
